<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Labels, not pathogens, led US food recalls in 2025</title>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="100" y="130" font-size="60" font-weight="700" fill="#16243a">Labels, not pathogens, led US food recalls</text>
  <text x="100" y="185" font-size="30" fill="#52607a">251 FDA food and beverage recall events, 2025, by cause</text>

  <g font-size="32" fill="#16243a">
    <text x="100" y="330">Undeclared allergen (label error)</text>
    <text x="100" y="440">Foodborne illness</text>
    <text x="100" y="550">Chemical contamination</text>
    <text x="100" y="660">Foreign objects</text>
    <text x="100" y="770">Other</text>
  </g>
  <!-- scale: 6 px per recall -->
  <rect x="640" y="285" width="690" height="64" rx="8" fill="#0f766e"/>
  <rect x="640" y="395" width="564" height="64" rx="8" fill="#a9b4c6"/>
  <rect x="640" y="505" width="156" height="64" rx="8" fill="#a9b4c6"/>
  <rect x="640" y="615" width="54" height="64" rx="8" fill="#a9b4c6"/>
  <rect x="640" y="725" width="42" height="64" rx="8" fill="#a9b4c6"/>
  <g font-size="34" font-weight="700" fill="#16243a">
    <text x="1350" y="331" fill="#0f766e">115  ·  45.8%</text>
    <text x="1224" y="441">94  ·  37.5%</text>
    <text x="816" y="551">26  ·  10.4%</text>
    <text x="714" y="661">9  ·  3.6%</text>
    <text x="702" y="771">7  ·  2.8%</text>
  </g>

  <rect x="100" y="860" width="1720" height="120" rx="16" fill="#eef6f5"/>
  <text x="140" y="915" font-size="30" fill="#16243a"><tspan font-weight="700">2024, same story (Loftware, FDA data):</tspan> 192 label-error recalls, 45% of all food recalls,</text>
  <text x="140" y="958" font-size="30" fill="#16243a">about $1.92 billion estimated direct cost to the industry. Listeria was next at 15%.</text>

  <text x="100" y="1040" font-size="22" fill="#52607a">Sources: Esko, "FDA food and beverage recalls 2025" (Jan–Dec 2025 FDA records; figures directional). Loftware analysis of FDA Enforcement Report data, 2024.</text>
</svg>
