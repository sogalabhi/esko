# Company rules layer: stricter-than-law rules (USDA Organic, Certified Vegan conditions). No rules yet.
id: company
name: Company rules
regulators: []
units: [g, oz]
currency: USD
number_format: western
languages: [English]
# The question window: how many questions are open at once, and how many of those seats are kept for design
# and brand questions so they do not wait behind every regulatory decision.
question_budget: 10
design_slots: 3
# Checker mode: the product checks finished artwork, so it asks no design (keep / change / remove) or brand-basics
# questions. Set to true to bring them back (the design-brief flow).
design_questions: false
