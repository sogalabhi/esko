source: "Food Safety and Standards (Labelling and Display) Regulations, 2020, regulation 5(14)"
url: https://fssai.gov.in/upload/uploadfiles/files/Compendium_Labelling_Display_04_01_2022.pdf
allergens: [cereals_containing_gluten, crustaceans, milk, eggs, fish, peanuts, tree_nuts, soybeans, sulphite]
notes: "List read through a reproduction of the regulation (taxguru.in) because the FSSAI PDF could not be text-extracted. Items as written: (i) cereals containing gluten, i.e. wheat, rye, barley, oats, spelt or their hybridized strains and products of these; (ii) crustacean and their products; (iii) milk and milk products; (iv) eggs and egg products; (v) fish and fish products; (vi) peanuts, tree nuts (e.g. almonds, walnuts, pistachio, cashew nuts) and their products; (vii) soybeans and their products; (viii) sulphite in concentrations of 10mg/kg or more. Peanuts and tree nuts are one entry in the regulation and are split here to match the shared vocabulary. A 2021 draft amendment proposed exceptions for some gluten-cereal derivatives; whether it was finalised was not confirmed. Sesame is NOT on this list. A person must check against the current FSSAI compendium."
