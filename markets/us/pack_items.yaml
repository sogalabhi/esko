# Required pack items. panel: front = principal display panel (PDP), any = PDP or information panel.
# min_height_mm = minimum letter height. Inches converted at 25.4 mm per inch (1/16 in = 1.5875 mm).
# Source details and exact quotes are in the rule records; "source" names the rule id.
pack_items:
  - {item: statement_of_identity, label: "Statement of identity", group: identity, panel: front, source: us.identity.statement_of_identity, notes: "Bold, in a size reasonably related to the most prominent print on the panel (us.identity.bold_and_prominent). No numeric minimum."}
  - {item: net_quantity, label: "Net quantity statement", group: quantity, panel: front, source: us.net_quantity.dual_units_bottom30, notes: "Distinct item in the bottom 30 percent of the PDP; ounces and grams (us.net_quantity.ounces_first, us.net_quantity.metric_units). Letter height depends on PDP area: see the next five items."}
  - {item: net_quantity_type_pdp_to_5_sq_in, label: "Net quantity letter height (front panel up to 5 sq in)", group: quantity, ask: false, panel: front, min_height_mm: 1.5875, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area 5 square inches or less: not less than 1/16 inch. Value from a tool reading of 21 CFR 101.7(i)(1); verify."}
  - {item: net_quantity_type_pdp_over_5_to_25_sq_in, label: "Net quantity letter height (front panel over 5 to 25 sq in)", group: quantity, ask: false, panel: front, min_height_mm: 3.175, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 5 but not over 25 square inches: not less than 1/8 inch (from a paraphrase of 101.7(i)(2); verify)."}
  - {item: net_quantity_type_pdp_over_25_to_100_sq_in, label: "Net quantity letter height (front panel over 25 to 100 sq in)", group: quantity, ask: false, panel: front, min_height_mm: 4.7625, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 25 but not over 100 square inches: not less than 3/16 inch (reported at 101.7(i)(3) as 'not less than three-sixteenths inch')."}
  - {item: net_quantity_type_pdp_over_100_to_400_sq_in, label: "Net quantity letter height (front panel over 100 to 400 sq in)", group: quantity, ask: false, panel: front, min_height_mm: 6.35, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 100 but not over 400 square inches: not less than 1/4 inch (from a paraphrase of 101.7(i)(4); verify)."}
  - {item: net_quantity_type_pdp_over_400_sq_in, label: "Net quantity letter height (front panel over 400 sq in)", group: quantity, ask: false, panel: front, min_height_mm: 12.7, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 400 square inches: not less than 1/2 inch (from a paraphrase of 101.7(i)(5); verify)."}
  - {item: manufacturer_name_place, label: "Manufacturer name and place", group: company, panel: any, source: us.name_place.manufacturer_packer_distributor, notes: "Name plus city, State and ZIP code; street address only if the firm is not in a current city or telephone directory (us.name_place.city_state_zip)."}
  - {item: ingredient_list, label: "Ingredient list", group: ingredients, panel: any, source: us.ingredients.descending_order, notes: "Descending order by weight, common or usual names."}
  - {item: allergen_declaration, label: 'Allergen "Contains" statement', group: allergens, panel: any, source: us.allergens.contains_or_parenthetical, notes: "Contains statement or parentheticals; tree nuts by type."}
  - {item: nutrition_facts, label: "Nutrition Facts panel", group: nutrition, panel: any, source: us.nutrition_facts.required_panel, notes: "Heading 'Nutrition Facts'; US format with Calories, Sodium, Added Sugars and % Daily Value."}
  - {item: calories, label: "Calories", group: nutrition, panel: any, min_height_mm: 5.64, source: us.nutrition_facts.calories_type_size, notes: "16 point = 5.64 mm type size (not a measured letter height). Proposed rule record; verify."}
  - {item: added_sugars, label: "Added sugars", group: nutrition, panel: any, source: us.added_sugars.declaration, notes: "Indented under Total Sugars, with % Daily Value."}
  # Added so every item a rule asks for has a name, a fact group and a panel (no rule content changed).
  - {item: manufacturer_address_city_state_zip, label: "Manufacturer city, state and ZIP code", group: company, panel: any, source: us.name_place.city_state_zip, notes: "City, State and ZIP code of the place of business."}
  - {item: net_quantity_ounces, label: "Net quantity in ounces", group: quantity, panel: front, source: us.net_quantity.ounces_first, notes: "Ounces first, with grams alongside (us.net_quantity.metric_units)."}
  - {item: net_quantity_metric, label: "Net quantity in grams", group: quantity, panel: front, source: us.net_quantity.metric_units, notes: "SI metric units alongside ounces."}
  - {item: percent_daily_value, label: "% Daily Value column", group: nutrition, panel: any, source: us.nutrition_facts.percent_daily_value, notes: "US Daily Reference Values, not EU reference intakes."}
  - {item: sodium, label: "Sodium", group: nutrition, panel: any, source: us.nutrition_facts.sodium_not_salt, notes: "Proposed rule record; used only when that rule is approved."}
  - {item: required_text_in_english, label: "Required text in English", group: packaging, panel: any, ask: false, source: us.language.english_required_text, notes: "Checked on the artwork text, not by asking a person."}
  - {item: no_added_sugar_claim_conditions, label: "Proof for the No Added Sugar claim", group: claims, panel: front, source: us.claims.no_added_sugars, notes: "A person must confirm the claim conditions listed in claims.yaml."}
  - {item: sugar_free_claim_conditions, label: "Proof for the Sugar Free claim", group: claims, panel: front, source: us.claims.sugar_free}
  - {item: gluten_free_claim_conditions, label: "Proof for the Gluten Free claim", group: claims, panel: front, source: us.claims.gluten_free}
  - {item: organic_certificate_and_certifier_name, label: "Organic certificate and certifier name", group: claims, panel: any, source: us.claims.organic, notes: "The certificate is not in the label files, so BriefForge asks for it."}
  - {item: allergen_declaration_tree_nut_type, label: "Tree nut types in the allergen statement", group: allergens, panel: any, source: us.allergens.tree_nuts_by_type, notes: "Proposed rule record."}
  - {item: front_of_pack_nutrition_info_box, label: "Front-of-pack nutrition info box", group: nutrition, panel: front, source: us.fop.nutrition_info_box, notes: "Proposed rule record."}
  - {item: healthy_claim_conditions, label: "Proof for the Healthy claim", group: claims, panel: front, source: us.healthy.updated_definition, notes: "Coming rule record (2028)."}
