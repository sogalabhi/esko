# Required pack items. panel: front = principal display panel (PDP), any = PDP or information panel.
# min_height_mm = minimum letter height. Inches converted at 25.4 mm per inch (1/16 in = 1.5875 mm).
# Source details and exact quotes are in the rule records; "source" names the rule id.
pack_items:
  - {item: statement_of_identity, panel: front, source: us.identity.statement_of_identity, notes: "Bold, in a size reasonably related to the most prominent print on the panel (us.identity.bold_and_prominent). No numeric minimum."}
  - {item: net_quantity, panel: front, source: us.net_quantity.dual_units_bottom30, notes: "Distinct item in the bottom 30 percent of the PDP; ounces and grams (us.net_quantity.ounces_first, us.net_quantity.metric_units). Letter height depends on PDP area: see the next five items."}
  - {item: net_quantity_type_pdp_to_5_sq_in, panel: front, min_height_mm: 1.5875, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area 5 square inches or less: not less than 1/16 inch. Value from a tool reading of 21 CFR 101.7(i)(1); verify."}
  - {item: net_quantity_type_pdp_over_5_to_25_sq_in, panel: front, min_height_mm: 3.175, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 5 but not over 25 square inches: not less than 1/8 inch (from a paraphrase of 101.7(i)(2); verify)."}
  - {item: net_quantity_type_pdp_over_25_to_100_sq_in, panel: front, min_height_mm: 4.7625, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 25 but not over 100 square inches: not less than 3/16 inch (reported at 101.7(i)(3) as 'not less than three-sixteenths inch')."}
  - {item: net_quantity_type_pdp_over_100_to_400_sq_in, panel: front, min_height_mm: 6.35, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 100 but not over 400 square inches: not less than 1/4 inch (from a paraphrase of 101.7(i)(4); verify)."}
  - {item: net_quantity_type_pdp_over_400_sq_in, panel: front, min_height_mm: 12.7, source: us.net_quantity.type_size_by_pdp_area, notes: "PDP area over 400 square inches: not less than 1/2 inch (from a paraphrase of 101.7(i)(5); verify)."}
  - {item: manufacturer_name_place, panel: any, source: us.name_place.manufacturer_packer_distributor, notes: "Name plus city, State and ZIP code; street address only if the firm is not in a current city or telephone directory (us.name_place.city_state_zip)."}
  - {item: ingredient_list, panel: any, source: us.ingredients.descending_order, notes: "Descending order by weight, common or usual names."}
  - {item: allergen_declaration, panel: any, source: us.allergens.contains_or_parenthetical, notes: "Contains statement or parentheticals; tree nuts by type."}
  - {item: nutrition_facts, panel: any, source: us.nutrition_facts.required_panel, notes: "Heading 'Nutrition Facts'; US format with Calories, Sodium, Added Sugars and % Daily Value."}
  - {item: calories, panel: any, min_height_mm: 5.64, source: us.nutrition_facts.calories_type_size, notes: "16 point = 5.64 mm type size (not a measured letter height). Proposed rule record; verify."}
  - {item: added_sugars, panel: any, source: us.added_sugars.declaration, notes: "Indented under Total Sugars, with % Daily Value."}
