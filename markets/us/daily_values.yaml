# Adults and children 4+ years (first population column). DRVs: 21 CFR 101.9(c)(9); RDIs: 21 CFR 101.9(c)(8)(iv).
# Numbers match the eCFR tables (checked against the Cornell LII copy of the eCFR text).
# Each quote is one table row: nutrient | unit of measure | adults and children 4+ value. Row cells are separated by " | " because the source is a table.
# Footnote markers in the source ([1] on 78, 20, 275, 28, 50) are omitted. Table lead-ins:
#   (c)(9): "The following DRVs, nomenclature, and units of measure are established for the following food components:"
#   (c)(8)(iv): "The following RDIs, nomenclature, and units of measure are established for the following vitamins and minerals which are essential in human nutrition:"
