# API_HOST is replaced by setup.sh (for example 152.67.1.2.sslip.io); certbot adds the HTTPS block.
server {
    listen 80;
    server_name API_HOST;

    # The demo carton PDF is about 6 MB; leave room for bigger artwork.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A full check, or Ask while Gemini is busy, can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
